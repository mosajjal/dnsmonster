baseURL = "https://dnsmonster.dev/"
title = "dnsmonster"
locale = "en-us"
enableRobotsTXT = true
enableInlineShortcodes = true
hasCJKLanguage = false

[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"

# FlexSearch builds its index through the asset pipeline, not an output format.
[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  page = ["HTML"]

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
  [markup.highlight]
    noClasses = false
    style = "github-dark"
    tabWidth = 2

[params]
  description = "Passive DNS monitoring framework. Capture, filter and ship hundreds of thousands of DNS queries per second to the backend of your choice."

  [params.navbar]
    displayTitle = false
    displayLogo = true
    # The wordmark is 1176x211 (5.59:1). Hextra defaults width to 20, which
    # squashes it — both dimensions have to be set.
    [params.navbar.logo]
      path = "img/logo-light.svg"
      dark = "img/logo-dark.svg"
      height = 26
      width = 145

  [params.theme]
    default = "dark"
    displayToggle = true

  [params.page]
    width = "normal"

  [params.search]
    enable = true
    type = "flexsearch"
    [params.search.flexsearch]
      index = "content"
      tokenize = "forward"

  [params.editURL]
    enable = false
    base = "https://github.com/mosajjal/dnsmonster/edit/main/docs/content"

  [params.footer]
    enable = true
    displayCopyright = false
    displayPoweredBy = false

  [params.blog.list]
    displayTags = false

[menu]
  [[menu.main]]
    name = "Documentation"
    pageRef = "/"
    weight = 1
  [[menu.main]]
    name = "FAQ"
    pageRef = "/faq"
    weight = 2
  [[menu.main]]
    name = "Search"
    weight = 8
    [menu.main.params]
      type = "search"
  [[menu.main]]
    name = "GitHub"
    url = "https://github.com/mosajjal/dnsmonster"
    weight = 9
    [menu.main.params]
      icon = "github"
