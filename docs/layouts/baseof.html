<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body>
    <a class="skip" href="#content">Skip to content</a>

    <header class="topbar">
      <a class="brand" href="{{ "/" | relURL }}">
        <img class="logo-dark" src="{{ "/img/logo-dark.svg" | relURL }}" alt="dnsmonster" width="180" height="32" />
        <img class="logo-light" src="{{ "/img/logo-light.svg" | relURL }}" alt="" aria-hidden="true" width="180" height="32" />
      </a>
      <div class="topbar-actions">
        <a class="ghost" href="{{ .Site.Params.github }}" rel="noopener">GitHub</a>
        <button class="ghost" id="theme-toggle" type="button" aria-label="Toggle colour theme">
          Theme
        </button>
        <button class="ghost nav-toggle" id="nav-toggle" type="button" aria-expanded="false">
          Menu
        </button>
      </div>
    </header>

    <div class="shell">
      {{ partial "sidebar.html" . }}

      <main id="content">
        {{ block "main" . }}{{ end }}
        {{ partial "footer.html" . }}
      </main>

      {{ if and (ne .Kind "home") .TableOfContents }}
        <aside class="toc">
          <p class="toc-title">On this page</p>
          {{ .TableOfContents }}
        </aside>
      {{ end }}
    </div>

    <script>
      (function () {
        var root = document.documentElement;
        var saved = localStorage.getItem('theme');
        if (saved) root.dataset.theme = saved;
        document.getElementById('theme-toggle').addEventListener('click', function () {
          var next = root.dataset.theme === 'dark' ? 'light' : 'dark';
          root.dataset.theme = next;
          localStorage.setItem('theme', next);
        });
        var nav = document.getElementById('nav-toggle');
        nav.addEventListener('click', function () {
          var open = document.body.classList.toggle('nav-open');
          nav.setAttribute('aria-expanded', String(open));
        });
      })();
    </script>
  </body>
</html>
