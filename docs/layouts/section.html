{{ define "main" }}
  <article class="prose">
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="lead">{{ . }}</p>{{ end }}
    {{ .Content }}

    {{ with .RegularPages.ByWeight }}
      <h2>In this section</h2>
      <ul class="child-list">
        {{ range . }}
          <li>
            <a href="{{ .RelPermalink }}">{{ .Title }}</a>
            {{ with .Description }}<span>{{ . }}</span>{{ end }}
          </li>
        {{ end }}
      </ul>
    {{ end }}
  </article>
{{ end }}
